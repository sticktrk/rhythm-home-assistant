name: Validate add-on
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_images:
        description: Explicitly run optional native cloud image validation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/validate.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
  image:
    if: github.event_name == 'workflow_dispatch' && inputs.build_images
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - run: python3 tools/build.py --platform ${{ matrix.platform }} --tag rhythm-ha:review
      - run: python3 tools/smoke.py --image rhythm-ha:review
