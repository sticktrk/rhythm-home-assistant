user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    map $http_x_ingress_path $rhythm_base {
        default "";
        ~^/api/hassio_ingress/[A-Za-z0-9_-]+$ $http_x_ingress_path/;
    }
    map $http_x_forwarded_proto $external_proto {
        default "";
        http http;
        https https;
    }
    server {
        listen 8099;
        # Only Supervisor's ingress proxy may supply the user identity.
        allow 172.30.32.2;
        deny all;
        if ($rhythm_base = "") { return 400; }
        root /opt/rhythm/ui;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        location /api/ {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
            proxy_set_header X-Remote-User-Name "";
            proxy_set_header X-Remote-User-Display-Name "";
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Proto $external_proto;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Connection "";
            proxy_read_timeout 130s;
            proxy_next_upstream off;
        }
        location /assets/ { try_files $uri =404; }
        location / {
            try_files $uri /local.html;
            sub_filter_once on;
            sub_filter '__RHYTHM_BASE__' $rhythm_base;
        }
    }
}
