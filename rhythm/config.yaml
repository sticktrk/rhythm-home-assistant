name: Rhythm
version: "0.1.0"
slug: rhythm
description: Adaptive lighting with a local admin web interface
url: https://github.com/sticktrk/rhythm-home-assistant
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true
hassio_api: false
auth_api: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lightbulb-auto
panel_title: Rhythm
panel_admin: true
backup: cold
timeout: 30
options:
  log_level: info
schema:
  log_level: list(error|warn|info|debug)
