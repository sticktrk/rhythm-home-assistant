name: Rhythm
version: "0.2.0-dev.2026100401"
slug: rhythm
description: Adaptive lighting with mobile control and Home Assistant administration
url: https://github.com/sticktrk/rhythm-home-assistant
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true
hassio_api: false
auth_api: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lightbulb-auto
panel_title: Rhythm
panel_admin: true
ports:
  54448/tcp: 54448
ports_description:
  54448/tcp: Authenticated Rhythm mobile API (LAN and event stream)
backup: cold
timeout: 30
options:
  log_level: info
schema:
  log_level: list(error|warn|info|debug)
